name: Docker Build & Publish

# Runs whenever a PR is merged into main (a merge is just a push to main)
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push-warehouse-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push warehouse-api
        uses: docker/build-push-action@v5
        with:
          context: ./WebApi
          file: ./WebApi/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-api:${{ github.sha }}
          cache-from: type=gha,scope=warehouse-api
          cache-to: type=gha,mode=max,scope=warehouse-api

  build-and-push-notifications-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push notifications-api
        uses: docker/build-push-action@v5
        with:
          context: ./Warehouse.Notifications
          file: ./Warehouse.Notifications/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-notifications-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/warehouse-notifications-api:${{ github.sha }}
          cache-from: type=gha,scope=notifications-api
          cache-to: type=gha,mode=max,scope=notifications-api
